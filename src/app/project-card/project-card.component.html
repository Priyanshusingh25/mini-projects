<a [href]="project.link" target="_blank" class="group relative block h-full overflow-hidden rounded-2xl bg-slate-900 border border-slate-800 transition-all duration-300 hover:shadow-2xl hover:shadow-indigo-500/20 hover:-translate-y-2">

      <div class="relative h-48 overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent opacity-60 z-10"></div>
        <img 
          [src]="project.image" 
          [alt]="project.title" 
          class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-110"
        />
      </div>

      <div class="relative z-20 p-6">
        <div class="mb-3 flex flex-wrap gap-2">
          <span *ngFor="let tag of project.tags" class="rounded-full bg-indigo-500/10 px-2.5 py-0.5 text-xs font-medium text-indigo-400 border border-indigo-500/20">
            {{ tag }}
          </span>
        </div>

        <h3 class="mb-2 text-xl font-bold text-white group-hover:text-indigo-400 transition-colors">
          {{ project.title }}
        </h3>

        <p class="text-sm text-slate-400 leading-relaxed line-clamp-3">
          {{ project.description }}
        </p>
      </div>

      <div class="absolute inset-0 border-2 border-transparent group-hover:border-indigo-500/30 rounded-2xl transition-all duration-300 pointer-events-none"></div>
    </a>
