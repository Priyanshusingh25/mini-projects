<main class="min-h-screen w-full bg-[#0B1120] py-20 px-4 sm:px-6 lg:px-8 relative overflow-hidden">
      <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-indigo-600/20 rounded-full blur-[120px] pointer-events-none"></div>
      <div class="relative max-w-7xl mx-auto">
        
        <header class="text-center mb-16 animate-fade-in-up">
          <h2 class="text-indigo-400 font-semibold tracking-wide uppercase text-sm mb-2">Portfolio</h2>
          <h1 class="text-4xl md:text-5xl font-extrabold text-white tracking-tight mb-4">
            Mini <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400">Projects</span>
          </h1>
          <p class="text-slate-400 max-w-2xl mx-auto text-lg">
            A curated collection of my experiments, tools, and creative coding endeavors.
          </p>
          
        </header>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 lg:gap-8">
          <app-project-card 
            *ngFor="let item of projects; let i = index" 
            [project]="item"
            [style.animation-delay]="i * 100 + 'ms'"
            class="animate-fade-in-up [animation-fill-mode:forwards]"
          ></app-project-card>
        </div>

      </div>
    </main>
